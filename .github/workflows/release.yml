name: release

# Publishes prebuilt `memmesh` binaries as release assets on every version tag.
# The install.sh script downloads these, so `curl … | sh` needs no Rust toolchain.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # allow manual trigger (build/publish for the checked-out ref)

permissions:
  contents: write   # required to upload assets to the GitHub Release

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin       # Apple Silicon
            os: macos-14
          - target: x86_64-apple-darwin        # Intel Mac
            os: macos-13
          - target: x86_64-unknown-linux-gnu   # Linux x86-64
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu  # Linux ARM64
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc     # Windows x64 (.zip)
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version; just ensure the target is present.
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      # Builds --release, tars the binary as memmesh-<target>.tar.gz, and uploads
      # it to the Release for this tag. Handles the aarch64-linux cross-linker.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: memmesh
          target: ${{ matrix.target }}
          archive: memmesh-$target
          token: ${{ secrets.GITHUB_TOKEN }}
