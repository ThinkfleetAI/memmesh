[package]
name = "memmesh-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "memmesh-desktop"
path = "src/main.rs"

[dependencies]
# The engine + console, embedded in-process — the desktop IS the Rust app.
memory-core.workspace = true
memory-embed = { workspace = true, features = ["fastembed"] }
memory-storage.workspace = true
memory-server.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
# Native window + system webview (no browser, no Tauri CLI, no Node).
tao = "0.30"
wry = "0.45"
