[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/embed",
    "crates/embed-server",
    "crates/storage",
    "crates/server",
    "crates/mcp",
    "crates/sync",
    "crates/audit",
    "crates/license",
    "crates/eval",
    "crates/cli",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
authors = ["MemMesh contributors"]
license = "Apache-2.0"
repository = "https://github.com/ThinkfleetAI/memmesh"
publish = false
rust-version = "1.78"

[workspace.dependencies]
# Error handling
anyhow = "1"
thiserror = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Storage
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
    "migrate",
    "postgres",
    "sqlite",
    "uuid",
    "chrono",
    "json",
    "bigdecimal",
] }

# Time / IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Heuristic extraction
regex = "1"
once_cell = "1"

# gRPC
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"

# HTTP API (used by the desktop GUI)
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HTTP client (used by the sync engine to talk to SaaS)
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "gzip",
] }

# Config
config = "0.14"

# Crypto for license keys
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
base64 = "0.22"
jsonwebtoken = "9"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# TOML (Codex CLI uses TOML for its config; everything else uses JSON)
toml = "0.8"
toml_edit = "0.22"

# YAML (eval fixtures + future doctor remediation plans)
serde_yaml = "0.9"

# Internal crates
memory-core = { path = "crates/core" }
memory-embed = { path = "crates/embed" }
memory-storage = { path = "crates/storage" }
memory-server = { path = "crates/server" }
memory-mcp = { path = "crates/mcp" }
memory-sync = { path = "crates/sync" }
memory-audit = { path = "crates/audit" }
memory-license = { path = "crates/license" }
memory-eval = { path = "crates/eval" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
