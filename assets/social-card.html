<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background:
      radial-gradient(1000px 700px at 88% 8%, rgba(139,92,246,0.28), transparent 60%),
      radial-gradient(800px 600px at 100% 100%, rgba(34,211,238,0.14), transparent 55%),
      linear-gradient(135deg, #0b1022 0%, #070a16 55%, #05060e 100%);
    color: #eef1f8;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(900px 600px at 20% 40%, #000 30%, transparent 75%);
            mask-image: radial-gradient(900px 600px at 20% 40%, #000 30%, transparent 75%);
  }
  .wrap { position: relative; height: 100%; padding: 72px 76px; display: flex; flex-direction: column; }
  .kicker {
    display: inline-flex; align-items: center; gap: 10px;
    align-self: flex-start;
    font-size: 16px; font-weight: 700; letter-spacing: 3px;
    color: #b9a7ff; text-transform: uppercase;
    padding: 9px 16px; border-radius: 999px;
    background: rgba(139,92,246,0.12);
    border: 1px solid rgba(139,92,246,0.35);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #8b5cf6; box-shadow: 0 0 12px 2px rgba(139,92,246,0.8); }
  h1 {
    margin-top: 34px;
    font-size: 92px; font-weight: 800; letter-spacing: -2px; line-height: 1;
    display: flex; align-items: center; gap: 20px;
  }
  h1 .name {
    background: linear-gradient(92deg, #c4b5fd 0%, #a78bfa 40%, #38bdf8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brain { font-size: 76px; -webkit-text-fill-color: initial; }
  .tag {
    margin-top: 26px;
    font-size: 33px; font-weight: 600; line-height: 1.28; color: #dfe4f2;
    max-width: 620px;
  }
  .tag b { color: #fff; }
  .pills { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 12px; max-width: 640px; }
  .pill {
    font-size: 19px; font-weight: 600; color: #cdd5ea;
    padding: 11px 18px; border-radius: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .pill .g { color: #34d399; font-weight: 800; }
  .foot {
    margin-top: auto; display: flex; align-items: center; gap: 16px;
    font-size: 24px; font-weight: 700; color: #f4f6fc;
  }
  .foot .apache { color: #8fa0c4; font-weight: 600; font-size: 20px; }
  .foot .sep { color: #3a4560; }
  .gh { display: inline-flex; align-items: center; gap: 10px; }
  .gh svg { width: 26px; height: 26px; fill: #eef1f8; }

  /* memory-graph motif */
  .mesh { position: absolute; top: 0; right: 0; width: 560px; height: 630px; }
  .mesh svg { width: 100%; height: 100%; overflow: visible; }
  .edge { stroke: url(#eg); stroke-width: 2; opacity: 0.5; }
  .node { fill: #0b1022; stroke: #8b5cf6; stroke-width: 2.5; filter: drop-shadow(0 0 10px rgba(139,92,246,0.8)); }
  .node.cy { stroke: #38bdf8; filter: drop-shadow(0 0 10px rgba(56,189,248,0.85)); }
  .hub { fill: #a78bfa; stroke: #ede9fe; stroke-width: 3; filter: drop-shadow(0 0 22px rgba(167,139,250,0.95)); }
  .core { fill: #38bdf8; }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="mesh">
    <svg viewBox="0 0 560 630">
      <defs>
        <linearGradient id="eg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8b5cf6"/>
          <stop offset="1" stop-color="#38bdf8"/>
        </linearGradient>
      </defs>
      <!-- edges -->
      <line class="edge" x1="300" y1="150" x2="430" y2="90"/>
      <line class="edge" x1="300" y1="150" x2="330" y2="300"/>
      <line class="edge" x1="430" y1="90"  x2="510" y2="230"/>
      <line class="edge" x1="330" y1="300" x2="510" y2="230"/>
      <line class="edge" x1="330" y1="300" x2="230" y2="410"/>
      <line class="edge" x1="330" y1="300" x2="470" y2="420"/>
      <line class="edge" x1="230" y1="410" x2="360" y2="520"/>
      <line class="edge" x1="470" y1="420" x2="360" y2="520"/>
      <line class="edge" x1="510" y1="230" x2="470" y2="420"/>
      <line class="edge" x1="300" y1="150" x2="210" y2="240"/>
      <line class="edge" x1="210" y1="240" x2="330" y2="300"/>
      <!-- nodes -->
      <circle class="node cy" cx="430" cy="90"  r="11"/>
      <circle class="node"    cx="300" cy="150" r="13"/>
      <circle class="node cy" cx="210" cy="240" r="9"/>
      <circle class="node cy" cx="510" cy="230" r="10"/>
      <circle class="hub"     cx="330" cy="300" r="20"/>
      <circle class="core"    cx="330" cy="300" r="7"/>
      <circle class="node"    cx="230" cy="410" r="11"/>
      <circle class="node cy" cx="470" cy="420" r="12"/>
      <circle class="node"    cx="360" cy="520" r="10"/>
    </svg>
  </div>

  <div class="wrap">
    <div class="kicker"><span class="dot"></span>Open Source · Apache-2.0</div>

    <h1><span class="brain">🧠</span><span class="name">MemMesh</span></h1>

    <div class="tag">Persistent, <b>local-first</b> memory for AI agents — in a single Rust binary.</div>

    <div class="pills">
      <span class="pill">One Rust binary</span>
      <span class="pill"><span class="g">✓</span> No vector DB</span>
      <span class="pill"><span class="g">✓</span> No mandatory LLM calls</span>
      <span class="pill">MCP-native</span>
    </div>

    <div class="foot">
      <span class="gh">
        <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        github.com/ThinkfleetAI/memmesh
      </span>
    </div>
  </div>
</body>
</html>
